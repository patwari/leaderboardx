<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeaderboardX Studio</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: "Inter", "Avenir Next", "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; background: #f5f7fb; color: #0f172a; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { position: sticky; top: 0; background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 18px; display: flex; gap: 18px; align-items: center; justify-content: space-between; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06); }
    header .title { font-weight: 800; letter-spacing: 0.2px; font-size: 16px; }
    header nav { display: flex; gap: 14px; font-size: 14px; }
    main { padding: 24px 20px 40px; max-width: 1100px; margin: 0 auto; }
    .card { border: 1px solid #e2e8f0; background: #ffffff; border-radius: 12px; padding: 16px 16px 18px; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06); }
    .muted { color: #475569; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .span-12 { grid-column: span 12; }
    .span-7 { grid-column: span 7; }
    .span-5 { grid-column: span 5; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #0f172a; text-transform: uppercase; letter-spacing: 0.2px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 14px; }
    button { padding: 9px 12px; border-radius: 10px; border: 1px solid #1d4ed8; background: #2563eb; color: #f8fafc; font-weight: 600; cursor: pointer; font-size: 13px; }
    button.secondary { background: #ffffff; color: #1d4ed8; border-color: #cbd5e1; }
    button.ghost { background: transparent; color: #0f172a; border-color: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
    th { color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 12px; }
    code { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 2px 6px; border-radius: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #eef2ff; border: 1px solid #c7d2fe; color: #4338ca; }
    @media (max-width: 900px) {
      .span-7, .span-5 { grid-column: span 12; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">LeaderboardX Studio</div>
    <nav>
      <a href="{{ base }}/overview">Overview</a>
      <a href="/docs" target="_blank">API Docs</a>
    </nav>
    <form method="post" action="{{ base }}/logout">
      <button type="submit" class="secondary">Log out</button>
    </form>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
