<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeaderboardX Studio</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; background: #f4f3ee; color: #1d1b16; }
    a { color: #1f4ed8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { position: sticky; top: 0; background: #f4f3ee; border-bottom: 1px solid #d8d2c6; padding: 16px 20px; display: flex; gap: 18px; align-items: baseline; justify-content: space-between; }
    header .title { font-weight: 800; letter-spacing: 0.3px; }
    header nav { display: flex; gap: 16px; font-size: 14px; }
    main { padding: 24px 20px 40px; max-width: 1100px; margin: 0 auto; }
    .card { border: 1px solid #d8d2c6; background: #ffffff; border-radius: 14px; padding: 18px; box-shadow: 0 10px 24px rgba(24, 22, 19, 0.08); }
    .muted { color: #6d6458; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .span-12 { grid-column: span 12; }
    .span-7 { grid-column: span 7; }
    .span-5 { grid-column: span 5; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #c9c0b2; background: #fcfbf9; font-size: 14px; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #1d1b16; background: #1d1b16; color: #fffaf0; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: #1d1b16; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e1dbd0; text-align: left; vertical-align: top; }
    th { color: #6d6458; font-weight: 600; }
    code { background: #f0ede7; border: 1px solid #e1dbd0; padding: 2px 6px; border-radius: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #f0ede7; border: 1px solid #d8d2c6; }
    @media (max-width: 900px) {
      .span-7, .span-5 { grid-column: span 12; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">LeaderboardX Studio</div>
    <nav>
      <a href="{{ base }}/overview">Overview</a>
      <a href="/docs" target="_blank">API Docs</a>
    </nav>
    <form method="post" action="{{ base }}/logout">
      <button type="submit" class="secondary">Log out</button>
    </form>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
