services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/leaderboard
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
      - SECRET_KEY=WgEPVP24jDgvDQYK
      - APP_NAME=LeaderboardX Development

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=leaderboard
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: